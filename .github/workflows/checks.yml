name: relay checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install client and test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Offline tests without a Wind installation
        run: python -m unittest discover -s tests -v
      - name: Parse Windows monitor installer without running it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $monitorTokens = $null
          $monitorParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'monitor/Install.ps1'), [ref]$monitorTokens, [ref]$monitorParseErrors) | Out-Null
          if ($monitorParseErrors.Count) { throw ($monitorParseErrors | Out-String) }
      - name: Build independent source package
        run: python build_release.py
      - name: Build portable read-only monitor
        run: python monitor/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: wind-terminal-relay-${{ matrix.os }}
          path: dist/*

