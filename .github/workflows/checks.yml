name: relay checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install client and test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Offline tests without a Wind installation
        run: python -m unittest discover -s tests -v
      - name: Parse Windows console scripts without running them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('Update.ps1','monitor/Install.ps1','.github/windows-console-smoke.ps1')) {
            $consoleTokens = $null
            $consoleParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$consoleTokens, [ref]$consoleParseErrors) | Out-Null
            if ($consoleParseErrors.Count) { throw ($consoleParseErrors | Out-String) }
          }
      - name: Build independent source package
        run: python build_release.py
      - name: Build unified console and updater
        run: python monitor/build_package.py
      - name: Install and upgrade console against a synthetic Windows deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-console-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: wind-terminal-relay-${{ matrix.os }}
          path: dist/*

